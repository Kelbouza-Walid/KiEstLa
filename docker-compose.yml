version: '3.8'

services:
  app:
    build: .
    container_name: kiestla-app
    ports:
      - "8200:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/kiestla_db
      - SPRING_DATASOURCE_USERNAME=groupe7
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: kiestla-db
    ports:
      - "8201:5432"
    environment:
      - POSTGRES_DB=kiestla_db
      - POSTGRES_USER=groupe7
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupe7 -d kiestla_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
