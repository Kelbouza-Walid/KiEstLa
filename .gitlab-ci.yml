stages:
  - test
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository

test-unit:
  stage: test
  image: eclipse-temurin:21-jdk-alpine
  script:
    - chmod +x mvnw
    - ./mvnw test -Dtest="\!CucumberTest"
  only:
    - merge_requests
    - main

test-acceptance:
  stage: test
  image: mcr.microsoft.com/playwright/java:v1.42.0-jammy
  script:
    - chmod +x mvnw
    - ./mvnw test -Dtest="CucumberTest"
  only:
    - merge_requests
    - main

build-java:
  stage: build
  image: eclipse-temurin:21-jdk-alpine
  script:
    - chmod +x mvnw
    - ./mvnw clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour
  only:
    - merge_requests
    - main

deploy-to-server:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan 172.20.128.60 >> ~/.ssh/known_hosts
  script:
    - echo "DB_PASSWORD=$DB_PASSWORD" > .env
    - echo "DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD" >> .env
    - ssh $SSH_USER@172.20.128.60 "mkdir -p ~/target"
    - scp target/*.jar $SSH_USER@172.20.128.60:~/target/
    - scp Dockerfile docker-compose.yml .env $SSH_USER@172.20.128.60:~/
    - ssh $SSH_USER@172.20.128.60 "docker compose up --build -d"
  only:
    - main
