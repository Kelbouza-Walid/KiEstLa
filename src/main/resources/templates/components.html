<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Generic Styled Table Component -->
<div th:fragment="styled_table(headers, bodyRows)" class="card shadow-sm mb-4">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered align-middle mb-0">
                <thead class="table-dark">
                    <tr th:replace="${headers}"></tr>
                </thead>
                <tbody>
                    <th:block th:replace="${bodyRows}"></th:block>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!--
    Comments side panel for absences.
    Opened by any button with data-bs-toggle="offcanvas" data-bs-target="#commentsPanel" data-absence-id="...".
    Comments are served by CommentController, which only gives access to secretaries and to the teachers of the absence's module.
    openFor: absence id whose panel is reopened on page load (after posting a comment), or null
    errorMessage: comment validation error to display, or null
-->
<div th:fragment="comments_panel(openFor, errorMessage)" class="offcanvas offcanvas-end" tabindex="-1"
     id="commentsPanel" data-testid="comments-panel" th:data-base-url="@{/absences}" th:data-open-for="${openFor}">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Comments</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
        <div id="comments-body" class="flex-grow-1 overflow-auto"></div>
        <div th:if="${errorMessage}" class="alert alert-danger mt-3 mb-0" role="alert"
             data-testid="comment-error" th:text="${errorMessage}"></div>
        <form id="comment-form" method="post" class="mt-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <textarea name="comment" data-testid="input-comment" class="form-control mb-2" rows="3" maxlength="2000" placeholder="Write a comment..."></textarea>
            <button type="submit" data-testid="btn-save-comment" class="btn btn-primary w-100">Add comment</button>
        </form>
    </div>
    <script th:src="@{/js/comments-panel.js}" defer></script>
</div>

<!--
    Comment list of an absence, loaded into the comments panel.
    Only the author of a comment can edit or delete it.
-->
<div th:fragment="comment_list">
    <p th:if="${#lists.isEmpty(comments)}" class="text-muted" data-testid="no-comments">No comments yet.</p>
    <div th:each="c : ${comments}" class="border-bottom py-2" data-testid="absence-comment">
        <div class="d-flex justify-content-between align-items-center">
            <strong data-testid="comment-author" th:text="${c.userFirstName + ' ' + c.userLastName}"></strong>
            <div th:if="${c.userLogin == #authentication.name}" class="d-flex">
                <button type="button" data-testid="btn-edit-comment" data-comment-action="edit"
                        class="btn btn-sm btn-link p-0 me-2">Edit</button>
                <form th:action="@{/comments/{id}/delete(id=${c.id})}" method="post" class="m-0"
                      onsubmit="return confirm('Are you sure you want to delete this comment ?');">
                    <button type="submit" data-testid="btn-delete-comment" class="btn btn-sm btn-link text-danger p-0">Delete</button>
                </form>
            </div>
        </div>
        <p class="mb-0" data-testid="comment-text" th:text="${c.comment}" style="white-space: pre-wrap;"></p>
        <form th:if="${c.userLogin == #authentication.name}" th:action="@{/comments/{id}/edit(id=${c.id})}"
              method="post" class="d-none" data-testid="edit-comment-form">
            <textarea name="comment" data-testid="input-edit-comment" class="form-control mb-2" rows="3" maxlength="2000"
                      th:text="${c.comment}"></textarea>
            <div class="d-flex justify-content-end">
                <button type="button" data-comment-action="cancel" class="btn btn-sm btn-secondary me-2">Cancel</button>
                <button type="submit" data-testid="btn-save-edit-comment" class="btn btn-sm btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
</html>
