<!DOCTYPE html>
<html th:replace="~{layout :: main_layout(~{::section})}" xmlns:th="http://www.thymeleaf.org">

<section>
    <div class="text-center py-5">
        <h1 data-testid="error-code" class="display-1 text-primary fw-bold">403</h1>
        <h2 data-testid="error-title" class="mb-3 text-dark">Access Denied</h2>
        <p data-testid="error-message" class="text-muted mb-4">Sorry, you do not have permission to access this page.</p>
        <a data-testid="btn-back-home" href="/" class="btn btn-primary">
            Back to Home
        </a>
    </div>
</section>

</html>
