<!DOCTYPE html>
<html th:replace="~{layout :: main_layout(~{::section})}" xmlns:th="http://www.thymeleaf.org">
<section>
    <div class="row justify-content-center mt-4">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="card border-0 shadow rounded-4">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary mb-3"
                             style="width: 64px; height: 64px; font-size: 1.75rem;">
                            <i class="bi bi-shield-lock"></i>
                        </div>
                        <h1 class="h3 fw-bold mb-1">Set a new password</h1>
                        <p class="text-muted small mb-0">Choose a new secure password for your account</p>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3" role="alert"
                         data-testid="reset-error">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <div th:text="${errorMessage}"></div>
                    </div>

                    <div th:if="${token != null}">
                        <form th:action="@{/reset-password}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="token" th:value="${token}" />

                            <div class="mb-3">
                                <label for="newPassword" class="form-label fw-semibold small">New password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                                    <input type="password" id="newPassword" name="newPassword"
                                           class="form-control" data-testid="input-new-password"
                                           autocomplete="new-password" required>
                                    <button type="button" class="btn btn-outline-secondary"
                                            data-toggle-password="newPassword"
                                            aria-label="Show or hide the password">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="progress mt-2" style="height: 6px;">
                                    <div id="strengthBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                                </div>
                                <div id="strengthLabel" class="form-text">At least 8 characters.</div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label fw-semibold small">Confirm new password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                                    <input type="password" id="confirmPassword" name="confirmPassword"
                                           class="form-control" data-testid="input-confirm-password"
                                           autocomplete="new-password" required>
                                    <button type="button" class="btn btn-outline-secondary"
                                            data-toggle-password="confirmPassword"
                                            aria-label="Show or hide the password">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div id="matchHint" class="form-text"></div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100" data-testid="btn-submit-reset-password">
                                <i class="bi bi-check2-circle me-1"></i> Update password
                            </button>
                        </form>
                    </div>

                    <div th:if="${token == null}" class="text-center mt-3">
                        <a th:href="@{/forgot-password}" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-repeat me-1"></i> Request a new link
                        </a>
                    </div>

                    <div class="text-center mt-4">
                        <a th:href="@{/login}" class="text-decoration-none small text-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Back to login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var newPwd = document.getElementById('newPassword');
            var confirmPwd = document.getElementById('confirmPassword');
            var bar = document.getElementById('strengthBar');
            var label = document.getElementById('strengthLabel');
            var matchHint = document.getElementById('matchHint');

            if (!newPwd || !confirmPwd) return;

            document.querySelectorAll('[data-toggle-password]').forEach(function (button) {
                button.addEventListener('click', function () {
                    var input = document.getElementById(button.dataset.togglePassword);
                    var show = input.type === 'password';
                    input.type = show ? 'text' : 'password';
                    button.querySelector('i').className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
                });
            });

            var colors = ['bg-danger', 'bg-warning', 'bg-info', 'bg-success'];
            var texts = ['Weak', 'Fair', 'Good', 'Strong'];

            function updateStrength() {
                var value = newPwd.value;
                if (value.length === 0) {
                    bar.style.width = '0%';
                    label.textContent = 'At least 8 characters.';
                    return;
                }
                if (value.length < 8) {
                    bar.style.width = '15%';
                    bar.className = 'progress-bar bg-danger';
                    label.textContent = 'Too short (8 characters minimum).';
                    return;
                }
                var score = 1;
                if (value.length >= 12) { score++; }
                if (/[A-Z]/.test(value) && /[a-z]/.test(value)) { score++; }
                if (/[0-9]/.test(value) && /[^A-Za-z0-9]/.test(value)) { score++; }
                bar.style.width = (score * 25) + '%';
                bar.className = 'progress-bar ' + colors[score - 1];
                label.textContent = 'Strength: ' + texts[score - 1];
            }

            function updateMatch() {
                if (confirmPwd.value.length === 0) {
                    matchHint.textContent = '';
                    matchHint.className = 'form-text';
                } else if (confirmPwd.value === newPwd.value) {
                    matchHint.textContent = 'The passwords match.';
                    matchHint.className = 'form-text text-success';
                } else {
                    matchHint.textContent = 'The passwords do not match.';
                    matchHint.className = 'form-text text-danger';
                }
            }

            newPwd.addEventListener('input', function () {
                updateStrength();
                updateMatch();
            });
            confirmPwd.addEventListener('input', updateMatch);
        })();
    </script>
</section>
</html>
