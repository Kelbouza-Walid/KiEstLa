<!DOCTYPE html>
<html th:replace="~{layout :: main_layout(~{::section})}" xmlns:th="http://www.thymeleaf.org">

<section>
    <a th:href="@{/student/absences}" class="btn btn-outline-secondary btn-sm mb-3">← Retour à mes absences</a>

    <h1 class="mb-4 text-primary">Détail de l'absence</h1>

    <div class="card shadow-sm" data-testid="student-absence-details">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Module</dt>
                <dd class="col-sm-9" data-testid="absence-module" th:text="${absence.moduleName}"></dd>

                <dt class="col-sm-3">Date</dt>
                <dd class="col-sm-9" data-testid="absence-date" th:text="${absence.date}"></dd>

                <dt class="col-sm-3">Statut</dt>
                <dd class="col-sm-9">
                    <span data-testid="absence-status"
                          th:class="${absence.status.name() == 'UNJUSTIFIED' ? 'badge bg-danger' : 'badge bg-success'}"
                          th:text="${absence.status}"></span>
                </dd>

                <dt class="col-sm-3">Motif</dt>
                <dd class="col-sm-9" data-testid="absence-motive-title"
                    th:text="${absence.motiveTitle ?: 'Aucun motif'}"></dd>

                <dt class="col-sm-3">Description</dt>
                <dd class="col-sm-9" data-testid="absence-motive-description"
                    th:text="${absence.motiveDescription ?: 'Aucune description'}"></dd>
            </dl>
        </div>
    </div>
</section>

</html>
