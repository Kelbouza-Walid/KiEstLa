<!DOCTYPE html>
<html th:replace="~{layout :: main_layout(~{::section})}" xmlns:th="http://www.thymeleaf.org">

<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="m-0 text-primary">Mes modules</h1>
        </div>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" data-testid="btn-logout" class="btn btn-outline-secondary">
                Déconnexion
            </button>
        </form>
    </div>

    <div th:replace="~{components :: styled_table(~{::#module-headers}, ~{::#module-rows})}">
        <my_headers id="module-headers">
            <th>Module</th>
            <th>Enseignant référent</th>
        </my_headers>
        <my_rows id="module-rows">
            <tr th:each="module : ${modules}" data-testid="teacher-module"
                th:onclick="'window.location.href=\'/module-details/' + ${module.id} + '\''"
                style="cursor: pointer;">
                <td th:text="${module.name}"></td>
                <td th:text="${module.referenceTeacherLastName ?: 'Aucun'}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(modules)}">
                <td colspan="2" class="text-center text-muted py-3">Aucun module ne vous est actuellement attribué.</td>
            </tr>
        </my_rows>
    </div>
</section>

</html>
