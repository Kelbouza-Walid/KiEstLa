<!DOCTYPE html>
<html th:replace="~{layout :: main_layout(~{::section})}" xmlns:th="http://www.thymeleaf.org">

<section>
    <a th:href="@{/teacher}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back</a>
    <h1 class="mb-3 text-primary">Absentee students</h1>
    <p class="text-muted">Students with at least 3 unjustified absences in one of your modules.</p>

    <div class="mb-3 d-flex gap-2">
        <a th:href="@{/teacher/absentees(sort='MODULE')}" data-testid="btn-sort-module"
           th:classappend="${sort == 'MODULE'} ? 'btn-primary' : 'btn-outline-primary'"
           class="btn btn-sm">Sort by module</a>
        <a th:href="@{/teacher/absentees(sort='STUDENT')}" data-testid="btn-sort-student"
           th:classappend="${sort == 'STUDENT'} ? 'btn-primary' : 'btn-outline-primary'"
           class="btn btn-sm">Sort by student</a>
    </div>

    <div th:replace="~{components :: styled_table(~{::#headersAbs}, ~{::#rowsAbs})}">
        <my_headers id="headersAbs">
            <th>Module</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Unjustified absences</th>
        </my_headers>
        <my_rows id="rowsAbs">
            <tr th:each="a : ${absentees}" data-testid="absentee-row">
                <td data-testid="absentee-module" th:text="${a.moduleName}"></td>
                <td data-testid="absentee-first-name" th:text="${a.firstName}"></td>
                <td data-testid="absentee-last-name" th:text="${a.lastName}"></td>
                <td data-testid="absentee-count" th:text="${a.absenceCount}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(absentees)}">
                <td colspan="4" data-testid="no-absentees" class="text-center text-muted py-3">
                    No student has reached 3 unjustified absences.
                </td>
            </tr>
        </my_rows>
    </div>
</section>

</html>
