<!DOCTYPE html>
<html th:replace="~{layout :: main_layout(~{::section})}" xmlns:th="http://www.thymeleaf.org">
<section>
    <div class="row justify-content-center mt-5">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary mb-3"
                             style="width: 64px; height: 64px; font-size: 1.75rem;">
                            <i class="bi bi-envelope-check"></i>
                        </div>
                        <h2 class="h3 fw-bold mb-1">Reset your password</h2>
                        <p class="text-muted small mb-0">Enter your login or email address to receive a reset link</p>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3" role="alert" data-testid="forgot-error">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <div th:text="${errorMessage}"></div>
                    </div>

                    <form th:action="@{/forgot-password}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-4">
                            <label for="identifier" class="form-label fw-semibold small">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="identifier" name="identifier"
                                       data-testid="input-identifier"
                                       placeholder="e.g. john.doe or jdoe@example.com" required autofocus>
                            </div>
                            <div class="form-text">
                                A reset link will be sent directly to the email registered for this account.
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3" data-testid="btn-submit-forgot-password">
                            <i class="bi bi-send me-1"></i> Send reset link
                        </button>

                        <div class="text-center mt-3">
                            <a th:href="@{/login}" class="text-decoration-none small text-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Back to login
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
