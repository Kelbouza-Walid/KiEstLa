<!DOCTYPE html>
<html th:replace="~{layout :: main_layout(~{::section})}" xmlns:th="http://www.thymeleaf.org">

<section>
    <h1 class="mb-4 text-primary">All Absences</h1>
    
    <div th:replace="~{components :: styled_table(~{::#headers1}, ~{::#rows1})}">
        <my_headers id="headers1">
            <th>ID</th>
            <th>Student</th>
            <th>Date</th>
            <th>Status</th>
            <th>Justification</th>
            <th>Actions</th>
        </my_headers>
        <my_rows id="rows1">
            <tr th:each="absence : ${absences}">
                <td th:text="${absence.id}"></td>
                <td th:text="${absence.student.firstName + ' ' + absence.student.lastName}"></td>
                <td th:text="${absence.date}"></td>
                <td>
                    <span th:class="${absence.status.name() == 'UNJUSTIFIED' ? 'badge bg-danger' : 'badge bg-success'}" 
                          th:text="${absence.status}"></span>
                </td>
                <td th:text="${absence.justification}"></td>
                <td>
                    <th:block th:if="${absence.status.name() == 'UNJUSTIFIED'}">
                        <button type="button" class="btn btn-sm btn-outline-success" data-bs-toggle="modal" th:data-bs-target="'#justifyModal' + ${absence.id}">
                            Add Justification
                        </button>
                        <form th:action="@{/secretary/absence/{id}/justify(id=${absence.id})}" method="post">
                            <div class="modal fade" th:id="'justifyModal' + ${absence.id}" tabindex="-1">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Provide Justification</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <label class="form-label text-start w-100">Reason for absence:</label>
                                            <textarea name="justificationText" class="form-control" rows="3" required></textarea>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                            <button type="submit" class="btn btn-success">Save & Justify</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </th:block>

                    <th:block th:if="${absence.status.name() == 'JUSTIFIED'}">
                        <form th:action="@{/secretary/absence/{id}/unjustify(id=${absence.id})}" method="post" class="m-0" onsubmit="return confirm('Are you sure you want to unjustify the absence ?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                Remove Justification
                            </button>
                        </form>
                    </th:block>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(absences)}">
                <td colspan="6" class="text-center text-muted py-3">No absences found in the database.</td>
            </tr>
        </my_rows>
    </div>
    
    <div th:replace="~{components :: styled_table(~{::#headers2}, ~{::#rows2})}">
        <my_headers id="headers2">
            <th>Name</th>
            <th>Referent Teacher</th>
        </my_headers>
        <my_rows id="rows2">
            <tr th:each="module : ${modules}">
                <td th:text="${module.name}"></td>
                <td th:text="${module.referentTeacherName}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(modules)}">
                <td colspan="4" class="text-center text-muted py-3">No modules found in the database.</td>
            </tr>
        </my_rows>
    </div>
</section>

</html>
