<!DOCTYPE html>
<html th:replace="~{layout :: main_layout(~{::section})}" xmlns:th="http://www.thymeleaf.org">

<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="m-0 text-primary">All Absences</h1>

        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" data-testid="btn-logout" class="btn btn-outline-secondary">
                Déconnexion
            </button>
        </form>
    </div>

    <div id="logout-error" data-testid="logout-error"
         class="alert alert-danger d-none" role="alert"></div>

    <script>
        document.getElementById('logout-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const form = e.currentTarget;
            const button = form.querySelector('button');
            const errorBox = document.getElementById('logout-error');

            errorBox.classList.add('d-none');
            errorBox.textContent = '';
            button.disabled = true;

            try {
                // FormData contient le champ _csrf ajouté automatiquement par th:action
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new URLSearchParams(new FormData(form)),
                    credentials: 'same-origin'
                });

                if (!response.ok) {
                    throw new Error('Le serveur a répondu avec le code ' + response.status + '.');
                }

                // Succès : Spring redirige vers /login?logout
                window.location.href = response.redirected ? response.url : '/login';
            } catch (err) {
                errorBox.textContent = 'La déconnexion a échoué : ' + err.message + ' Veuillez réessayer.';
                errorBox.classList.remove('d-none');
                button.disabled = false;   // permet de réessayer
            }
        });
    </script>
    
    <div th:replace="~{components :: styled_table(~{::#headers1}, ~{::#rows1})}">
        <my_headers id="headers1">
            <th>ID</th>
            <th>Student</th>
            <th>Date</th>
            <th>Status</th>
            <th>Justification</th>
            <th>Actions</th>
        </my_headers>
        <my_rows id="rows1">
            <tr th:each="absence : ${absences}">
                <td data-testid="absence-id" th:text="${absence.id}"></td>
                <td data-testid="absence-student" th:text="${absence.studentName}"></td>
                <td data-testid="absence-date" th:text="${absence.date}"></td>
                <td>
                    <span data-testid="absence-status"
                          th:class="${absence.status.name() == 'UNJUSTIFIED' ? 'badge bg-danger' : 'badge bg-success'}" 
                          th:text="${absence.status}"></span>
                </td>
                <td data-testid="absence-justification" th:text="${absence.justification}"></td>
                <td>
                    <th:block th:if="${absence.status.name() == 'UNJUSTIFIED'}">
                        <button type="button" data-testid="btn-add-justification" class="btn btn-sm btn-outline-success" data-bs-toggle="modal" th:data-bs-target="'#justifyModal' + ${absence.id}">
                            Add Justification
                        </button>
                        <form th:action="@{/secretary/absence/{id}/justify(id=${absence.id})}" method="post">
                            <div class="modal fade" th:id="'justifyModal' + ${absence.id}" tabindex="-1">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Provide Justification</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <label class="form-label text-start w-100">Reason for absence:</label>
                                            <textarea data-testid="input-justification-text" name="justification" class="form-control" rows="3" required></textarea>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                            <button type="submit" data-testid="btn-save-justification" class="btn btn-success">Save & Justify</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </th:block>

                    <th:block th:if="${absence.status.name() == 'JUSTIFIED'}">
                        <form th:action="@{/secretary/absence/{id}/unjustify(id=${absence.id})}" method="post" class="m-0" onsubmit="return confirm('Are you sure you want to unjustify the absence ?');">
                            <button type="submit" data-testid="btn-remove-justification" class="btn btn-sm btn-outline-danger">
                                Remove Justification
                            </button>
                        </form>
                    </th:block>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(absences)}">
                <td colspan="6" class="text-center text-muted py-3">No absences found in the database.</td>
            </tr>
        </my_rows>
    </div>
    
    <h1 class="mb-4 text-primary">All Modules</h1>
    <div th:replace="~{components :: styled_table(~{::#headers2}, ~{::#rows2})}">
        <my_headers id="headers2">
            <th>Name</th>
            <th>Referent Teacher</th>
        </my_headers>
        <my_rows id="rows2">
            <tr th:each="module : ${modules}" data-testid="btn-module-details" th:onclick="'window.location.href=\'/module-details/' + ${module.id} + '\''" style="cursor: pointer;">
                    <td th:text="${module.name}"></td>
                    <td th:text="${module.referenceTeacherLastName ?: 'None'}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(modules)}">
                <td colspan="4" class="text-center text-muted py-3">No modules found in the database.</td>
            </tr>
        </my_rows>
    </div>
</section>

</html>
